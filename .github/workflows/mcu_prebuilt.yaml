# Publish prebuilt Slint binaries for ESP32 firmware.
#
# Consumers download these instead of building the Rust core, which removes the esp
# Rust toolchain and a multi-minute cargo build from every firmware build.
#
# Three pieces are published per release:
#   Slint-cpp-<version>-<rust_target>.tar.gz   the static lib + C++ headers (incl. generated)
#   slint-compiler-<host>(.exe)                 the .slint -> C++ compiler, host binaries
#   slint-lsp-<host>(.exe)                      language server, for the editor preview
#
# The compiler MUST come from this fork: it carries the glyph-embedding limit that keeps
# large font sizes inside the flash budget. Upstream's compiler would silently embed the
# full charset.
#
# The LSP must too, for the same reason in reverse - it is the compiler the editor parses
# with, so a stock one rejects our arc properties and no preview opens. Consumers point
# the VS Code extension at it with slint.lspBinaryPath.

name: MCU prebuilt package

on:
    workflow_dispatch:
    push:
        tags:
            - "mcu-v*"

env:
    CARGO_INCREMENTAL: "false"
    CARGO_PROFILE_RELEASE_LTO: "fat"
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    # Must match the cargo features the firmware's CMakeLists requests. software-renderer-path
    # is required for Path/ArcTo, which the UI uses for arcs.
    SLINT_MCU_FEATURES: "-DSLINT_FEATURE_FREESTANDING=ON -DSLINT_FEATURE_RENDERER_SOFTWARE=ON -DSLINT_FEATURE_SOFTWARE_RENDERER_PATH=ON -DSLINT_FEATURE_SOFTWARE_RENDERER_CACHES=ON"
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    renderer-tests:
        name: software renderer tests
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/install-linux-dependencies
            - uses: dtolnay/rust-toolchain@stable
            - run: python3 api/cpp/tests/test_mcu_package.py
            - run: cmake -P api/cpp/tests/check_software_cache_features.cmake
            - run: cargo test --release -p i-slint-renderer-software --no-default-features --features std,testing --lib
            - run: cargo test --release -p i-slint-renderer-software --no-default-features --features std,testing,embedded-caches --lib
            - run: cargo test --release --manifest-path tests/software-renderer-cache/Cargo.toml
            - run: cargo test --release --manifest-path tests/software-renderer-cache/Cargo.toml --no-default-features
            - run: cargo test --release --manifest-path tests/software-renderer-cache/Cargo.toml --features vector-fonts
            - run: cargo test --release --manifest-path tests/software-renderer-cache/Cargo.toml --features sdf-fonts

    library:
        name: libslint_cpp.a (${{ matrix.rust_target }})
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - idf_target: esp32s3
                      rust_target: xtensa-esp32s3-none-elf
                      compiler_prefix: xtensa-esp-elf
                      compiler_flags: ""
                    - idf_target: esp32p4
                      rust_target: riscv32imafc-esp-espidf
                      compiler_prefix: riscv32-esp-elf
                      compiler_flags: "-march=rv32imafc_zicsr_zifencei_xesppie -mabi=ilp32f"
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/install-linux-dependencies
            - uses: dtolnay/rust-toolchain@stable
            - uses: cargo-bins/cargo-binstall@main
            - name: install espup
              run: |
                  cargo binstall --no-confirm espup
                  espup install
                  rustup default esp
            - name: add esp toolchain to PATH
              run: |
                  source "$HOME/export-esp.sh"
                  echo "$PATH" >> "$GITHUB_PATH"
            - uses: actions/setup-python@v6
              if: matrix.idf_target == 'esp32p4'
              with:
                  python-version: '3.12'
            - name: install RISC-V compiler
              if: matrix.idf_target == 'esp32p4'
              run: |
                  python -m pip install platformio==6.2.0
                  pio pkg install --global --tool 'platformio/toolchain-riscv32-esp@15.2.0+20251204'
                  echo "$HOME/.platformio/packages/toolchain-riscv32-esp/bin" >> "$GITHUB_PATH"
            - name: prepare licenses
              working-directory: api/cpp/
              run: bash -x ../../scripts/prepare_binary_package.sh ${{ runner.temp }}/slint-cppbuild
            - name: configure and build
              uses: lukka/run-cmake@v3.4
              with:
                  cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
                  cmakeListsTxtPath: CMakeLists.txt
                  cmakeAppendedArgs: >-
                      -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
                      -DESP_PLATFORM=1 -DIDF_TARGET=${{ matrix.idf_target }}
                      -DRust_CARGO_TARGET=${{ matrix.rust_target }}
                      -DCMAKE_C_COMPILER=${{ matrix.compiler_prefix }}-gcc
                      -DCMAKE_CXX_COMPILER=${{ matrix.compiler_prefix }}-g++
                      -DCMAKE_AR=${{ matrix.compiler_prefix }}-ar
                      -DCMAKE_RANLIB=${{ matrix.compiler_prefix }}-ranlib
                      -DCMAKE_STRIP=${{ matrix.compiler_prefix }}-strip
                      -DCMAKE_C_FLAGS='${{ matrix.compiler_flags }}'
                      -DCMAKE_CXX_FLAGS='${{ matrix.compiler_flags }}'
                      -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
                      -DSLINT_LIBRARY_CARGO_FLAGS='-Zbuild-std=core,alloc'
                      -DSLINT_COMPILER=download
                      ${{ env.SLINT_MCU_FEATURES }}
                  buildDirectory: ${{ runner.temp }}/slint-cppbuild
                  buildWithCMakeArgs: "--config Release"
            - name: cpack
              working-directory: ${{ runner.temp }}/slint-cppbuild
              run: cpack -G TGZ
            - name: validate MCU package
              working-directory: ${{ runner.temp }}/slint-cppbuild
              run: python3 "$GITHUB_WORKSPACE/scripts/validate_mcu_package.py" Slint-cpp-*-${{ matrix.rust_target }}.tar.gz --target ${{ matrix.rust_target }}
            - uses: actions/upload-artifact@v7
              with:
                  name: slint-cpp-${{ matrix.rust_target }}
                  path: ${{ runner.temp }}/slint-cppbuild/Slint-cpp-*.tar.gz

    host-binaries:
        name: host binaries (${{ matrix.host }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-2022
                      host: windows-x86_64
                      suffix: .exe
                    - os: ubuntu-22.04
                      host: linux-x86_64
                      suffix: ""
                    - os: macos-14
                      host: macos-aarch64
                      suffix: ""
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - name: build
              run: cargo build --release --bin slint-compiler --bin slint-lsp
            - name: stage
              shell: bash
              run: |
                  mkdir -p dist
                  cp "target/release/slint-compiler${{ matrix.suffix }}" dist/
                  cp "target/release/slint-lsp${{ matrix.suffix }}" dist/
            - uses: actions/upload-artifact@v7
              with:
                  name: host-binaries-${{ matrix.host }}
                  path: dist/*

    release:
        name: publish release
        needs: [renderer-tests, library, host-binaries]
        runs-on: ubuntu-22.04
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v8
              with:
                  path: artifacts
            - name: flatten and name the host binaries
              run: |
                  mkdir -p release
                  for target in xtensa-esp32s3-none-elf riscv32imafc-esp-espidf; do
                    archives=(artifacts/slint-cpp-$target/Slint-cpp-*-$target.tar.gz)
                    test "${#archives[@]}" -eq 1
                    test -f "${archives[0]}"
                    python3 scripts/validate_mcu_package.py "${archives[0]}" --target "$target"
                    cp "${archives[0]}" release/
                  done
                  # Assets are named <tool>-<host>(.exe): the host tag has to be in the
                  # filename because a release is one flat namespace.
                  for host in windows-x86_64 linux-x86_64 macos-aarch64; do
                    dir="artifacts/host-binaries-$host"
                    test -d "$dir"
                    case "$host" in windows-*) sfx=".exe" ;; *) sfx="" ;; esac
                    for tool in slint-compiler slint-lsp; do
                      src=$(find "$dir" -type f -name "$tool$sfx" | head -1)
                      test -n "$src"
                      cp "$src" "release/$tool-$host$sfx"
                    done
                  done
                  cd release
                  sha256sum Slint-cpp-*.tar.gz slint-compiler-* slint-lsp-* > SHA256SUMS
                  sha256sum --check SHA256SUMS
                  ls -la
            - uses: softprops/action-gh-release@v2
              with:
                  files: release/*
                  generate_release_notes: true
